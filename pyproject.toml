[build-system]

requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "GRAPHIS"
version = "3.0"
description = "Create, edit, annotate, and export IPTC image regions"
readme = "readme.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["license"]

authors = [
  { name = "Martin Wieser" },
  { name = "Geert Verhoeven" },
]

maintainers = [
  { name = "Martin Wieser" },
]

keywords = [
  "IPTC",
  "IPTC image region",
  "image metadata",
  "image regions",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    'numpy>=2.0.0',
    'shapely>=2.0.1',
    'iptc-iris>=0.1.0,<0.2',
    'Pillow>=12.2.0',
    'rawpy>=0.27.0',
    'PySide6>=6.11.0',
    'PySide6_Essentials>=6.11.0',
    'PySide6_Addons>=6.11.0']

[project.optional-dependencies]
directml = [
    'torch-directml; sys_platform == "win32"',
]
ai = [
    'opencv-python>=4.10.0.84',
    'scikit-image',
    'timm',
    'torch',
    'torchvision',
    'ultralytics>=8.3.237',
]
speech = [
    'faster-whisper>=1.1',
]
texturesam = [
    'hydra-core>=1.3.2,<1.4',
    'iopath>=0.1.10',
    'omegaconf>=2.3.0,<2.4',
    'opencv-python>=4.10.0.84',
    'torch',
    'torchvision',
]

[project.urls]
    "Homepage" = "https://github.com/GraffitiProjectINDIGO/GRAPHIS"
    "Bug Tracker" = "https://github.com/GraffitiProjectINDIGO/GRAPHIS/issues"

[project.gui-scripts]
graphis = "graphis.main:main"
